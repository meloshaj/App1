services:
  redis:
    image: redis:7-alpine

  api:
    build: .
    container_name: mcpi-api
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    ports:
      -  8000:8000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.celery_app.celery_app worker -Q default -l info
